# Apache settings for www.rundoctor.com (installed at /etc/apache2/conf-available/rundoctor.conf)
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectorySlash Off
    RewriteEngine On

    # --- Old WordPress URLs -> live pages (permanent 301) ---
    RewriteRule ^(index\.html|index\.php)$ / [R=301,L]
    RewriteRule ^contactus/?$ https://l.klara.com/RMc47XV4DhKeJncQ [R=301,QSD,NE,L]
    RewriteRule ^schedule/?$ https://l.klara.com/RMc47XV4DhKeJncQ [R=301,QSD,NE,L]
    RewriteRule ^contents/patient-forms/?$ https://l.klara.com/RMc47XV4DhKeJncQ [R=301,QSD,NE,L]
    RewriteRule ^contents/our-mission/?$ /about [R=301,L]
    RewriteRule ^contents/community-page/?$ /about [R=301,L]
    RewriteRule ^contents/services/low-back-pain/?$ /services/low-back-pain [R=301,L]
    RewriteRule ^contents/educational-videos/?$ /services [R=301,L]
    RewriteRule ^contents/.*$ / [R=301,L]
    RewriteRule ^services/pediatric-podiatrist/?$ /services/pediatric-podiatry [R=301,L]

    # Old blog posts the archive did not have -> closest live page
    RewriteRule ^blog/2-foot-problems-that-can-cause-low-back-pain-and-how-to-treat-them/?$ /services/low-back-pain [R=301,L]
    RewriteRule ^blog/stop-waking-up-to-heel-pain-the-ultimate-guide-to-beating-plantar-fasciitis/?$ /blog/why-plantar-fasciitis-feels-worse-in-the-morning [R=301,L]
    RewriteRule ^blog/getting-ready-for-school-sports-understanding-your-options-with-sports-medicine/?$ /services/youth-sports-injuries [R=301,L]
    RewriteRule ^blog/dont-ignore-that-ankle-sprain-how-to-prevent-chronic-pain-and-instability/?$ /services/trauma [R=301,L]
    RewriteRule ^provider/lawrence-maurer-dpm/?$ /provider#maurer [R=301,NE,L]
    RewriteRule ^provider/peter-m-vincent-dpm/?$ /provider [R=301,L]

    # --- Clean URLs ---
    RewriteRule ^services/$ /services [R=301,L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME}.html -f
    RewriteRule ^(.+)$ $1.html [L]
</Directory>

ErrorDocument 404 /404.html

# Old blog images keep working at their old addresses
Alias /wp-content/uploads /var/www/html-wp-old/wp-content/uploads
<Directory /var/www/html-wp-old/wp-content/uploads>
    Options -Indexes
    Require all granted
</Directory>

# --- Browser caching for static files (HTML stays no-cache) ---
<IfModule mod_headers.c>
    <LocationMatch "^/_astro/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(images|blog-images|logos|videos|wp-content/uploads)/|^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png)$">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
</IfModule>
